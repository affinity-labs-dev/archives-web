name: Build and gate

# The gate that stops a credential reaching a browser.
#
# It runs here rather than as a Vercel buildCommand on purpose: this repo's
# Vercel project still serves the live vanilla app at web.archiveszone.app, and
# giving it a build step that emits dist/ would swap the live site for the
# in-progress port. When the port cuts over, move these same two commands into
# vercel.json's buildCommand so a failing scan fails the deploy too.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Unit tests first: they need no build and fail fastest.
      - name: Unit tests
        run: npx vitest run

      - name: Build the web bundle
        env:
          # Publishable/ingestion keys only - every one of these is designed to
          # be readable in a browser. Nothing secret belongs in this list, and
          # the scan below is what proves nothing secret got in anyway.
          #
          # Optional: absent values just build an app that cannot sign in, which
          # is fine for a build-output scan.
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ vars.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_POSTHOG_HOST }}
          # Always set, and deliberately not a secret: it guarantees the
          # scan has at least one real value to look for. Without it, an
          # unconfigured repo would set every var to "" and the value scan
          # would pass while checking nothing.
          EXPO_PUBLIC_API_ORIGIN: https://web.archiveszone.app
        run: npx expo export -p web

      - name: Secrets and build-output gate
        env:
          # CI=true turns "no dist/ found" from a skip into a failure. Without
          # it a build that silently produced nothing would pass every scan.
          CI: 'true'
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ vars.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_POSTHOG_HOST }}
          # Always set, and deliberately not a secret: it guarantees the
          # scan has at least one real value to look for. Without it, an
          # unconfigured repo would set every var to "" and the value scan
          # would pass while checking nothing.
          EXPO_PUBLIC_API_ORIGIN: https://web.archiveszone.app
        # The same environment as the build, deliberately: the scan looks for
        # the *values* the build had available, because Metro replaces
        # process.env references with literals and the variable names do not
        # survive.
        run: npx vitest run api/_lib/__tests__/no-secrets-shipped.spec.js api/_lib/__tests__/build-output.spec.js
