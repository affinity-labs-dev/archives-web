<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Assets Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Onest', sans-serif; background: #FAFAFA; color: #1A1A1A; padding: 48px 24px; }
  .page { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 32px; font-weight: 900; letter-spacing: 1px; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: #737373; font-weight: 500; margin-bottom: 40px; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; }
  .card {
    background: #FFF;
    border: 1px solid #E5E5E5;
    border-radius: 16px;
    overflow: hidden;
    flex: 1 1 280px;
    max-width: 420px;
  }
  .card-preview {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 200px;
    background: repeating-conic-gradient(#f0f0f0 0% 25%, #fff 0% 50%) 50% / 16px 16px;
  }
  .card-preview img {
    max-width: 100%;
    max-height: 300px;
    object-fit: contain;
  }
  .card-preview.dark {
    background: #1A1A1A;
  }
  .card-info {
    padding: 14px 18px;
    border-top: 1px solid #F0F0F0;
  }
  .card-name { font-size: 14px; font-weight: 700; }
  .card-size { font-size: 12px; color: #999; font-weight: 500; margin-top: 2px; }
</style>
</head>
<body>
<div class="page">
  <h1>SVG ASSETS</h1>
  <p class="subtitle">All SVG files in DesignPlayground/assets/. Checkerboard background for transparency.</p>
  <div class="grid">
    <div class="card">
      <div class="card-preview"><img src="welcome.svg" alt="welcome"></div>
      <div class="card-info"><div class="card-name">welcome.svg</div><div class="card-size">125 KB</div></div>
    </div>
    <div class="card">
      <div class="card-preview"><img src="onboardingicon.svg" alt="onboardingicon"></div>
      <div class="card-info"><div class="card-name">onboardingicon.svg</div><div class="card-size">328 KB</div></div>
    </div>
    <div class="card">
      <div class="card-preview"><img src="learnislamic.svg" alt="learnislamic"></div>
      <div class="card-info"><div class="card-name">learnislamic.svg</div><div class="card-size">8 KB</div></div>
    </div>
    <div class="card">
      <div class="card-preview"><img src="sayhitoibu.svg" alt="sayhitoibu"></div>
      <div class="card-info"><div class="card-name">sayhitoibu.svg</div><div class="card-size">5 KB</div></div>
    </div>
    <div class="card">
      <div class="card-preview"><img src="line1.svg" alt="line1"></div>
      <div class="card-info"><div class="card-name">line1.svg</div><div class="card-size">5 KB</div></div>
    </div>
    <div class="card">
      <div class="card-preview"><img src="line2.svg" alt="line2"></div>
      <div class="card-info"><div class="card-name">line2.svg</div><div class="card-size">5 KB</div></div>
    </div>
    <div class="card">
      <div class="card-preview dark"><img src="apple-icon.svg" alt="apple-icon"></div>
      <div class="card-info"><div class="card-name">apple-icon.svg</div><div class="card-size">1 KB</div></div>
    </div>
    <div class="card">
      <div class="card-preview"><img src="stars.svg" alt="stars"></div>
      <div class="card-info"><div class="card-name">stars.svg</div><div class="card-size">1 KB</div></div>
    </div>
    <div class="card">
      <div class="card-preview dark"><img src="book.svg" alt="book"></div>
      <div class="card-info"><div class="card-name">book.svg</div><div class="card-size">1 KB</div></div>
    </div>
    <div class="card">
      <div class="card-preview"><img src="clock.svg" alt="clock"></div>
      <div class="card-info"><div class="card-name">clock.svg</div><div class="card-size">2 KB</div></div>
    </div>
  </div>
</div>
</body>
</html>
