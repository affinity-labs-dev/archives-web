<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Creature</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #e8e8e8;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* iPhone frame */
        .iphone-frame {
            width: 393px;
            height: 852px;
            background: #1a1a1a;
            border-radius: 55px;
            padding: 12px;
            box-shadow:
                0 0 0 2px #333,
                0 20px 60px rgba(0,0,0,0.4),
                inset 0 0 0 2px #2a2a2a;
            position: relative;
        }
        .iphone-screen {
            width: 100%;
            height: 100%;
            background: #fafafa;
            border-radius: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        /* Dynamic Island */
        .dynamic-island {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 37px;
            background: #1a1a1a;
            border-radius: 20px;
            z-index: 10;
        }
        /* Home indicator */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 5px;
            background: #ccc;
            border-radius: 3px;
        }

        svg {
            width: 260px;
            height: auto;
            overflow: visible;
        }

        /* Breathing */
        .creature {
            animation: breathe 3.5s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center bottom;
        }
        @keyframes breathe {
            0%, 100% { transform: scaleY(1) scaleX(1) translateY(0); }
            45% { transform: scaleY(1.018) scaleX(1.006) translateY(-0.4px); }
            55% { transform: scaleY(1.018) scaleX(1.006) translateY(-0.4px); }
        }

        /* Pupil blink - faster & more natural */
        .right-pupil, .left-pupil {
            transform-box: fill-box;
            transform-origin: center center;
        }
        .right-pupil {
            animation: blink 2.8s ease-in-out infinite;
        }
        .left-pupil {
            animation: blink 2.8s ease-in-out infinite 0.02s;
        }
        @keyframes blink {
            0%, 85%, 100% { transform: scaleY(1); }
            91% { transform: scaleY(0.05); }
            94% { transform: scaleY(1); }
        }

        /* Occasional double blink */
        .right-pupil-wrap, .left-pupil-wrap {
            transform-box: fill-box;
            transform-origin: center center;
        }
        .right-pupil-wrap {
            animation: halfBlink 6s ease-in-out infinite 3s;
        }
        .left-pupil-wrap {
            animation: halfBlink 6s ease-in-out infinite 3.02s;
        }
        @keyframes halfBlink {
            0%, 88%, 100% { transform: scaleY(1); }
            93% { transform: scaleY(0.05); }
            96% { transform: scaleY(1); }
        }

        /* Left ear wiggle - more movement */
        .left-ear {
            transform-box: fill-box;
            transform-origin: right bottom;
            animation: leftEarWiggle 3.5s ease-in-out infinite;
        }
        @keyframes leftEarWiggle {
            0%, 65%, 100% { transform: scale(1.2) rotate(0deg) translate(3px, 2px); }
            70% { transform: scale(1.2) rotate(4deg) translate(3px, 2px); }
            76% { transform: scale(1.2) rotate(-2deg) translate(3px, 2px); }
            82% { transform: scale(1.2) rotate(2deg) translate(3px, 2px); }
            88% { transform: scale(1.2) rotate(0deg) translate(3px, 2px); }
        }

        /* Right ear wiggle - more movement */
        .right-ear {
            transform-box: fill-box;
            transform-origin: left bottom;
            animation: rightEarWiggle 4s ease-in-out infinite 0.5s;
        }
        @keyframes rightEarWiggle {
            0%, 60%, 100% { transform: scale(1.2) rotate(0deg) translate(-3px, 2px); }
            66% { transform: scale(1.2) rotate(-3deg) translate(-3px, 2px); }
            72% { transform: scale(1.2) rotate(2deg) translate(-3px, 2px); }
            78% { transform: scale(1.2) rotate(-1.5deg) translate(-3px, 2px); }
            84% { transform: scale(1.2) rotate(0deg) translate(-3px, 2px); }
        }

        /* Eyebrow animations - subtle, at intervals */
        .left-eyebrow {
            transform-box: fill-box;
            transform-origin: center bottom;
            animation: leftBrowRaise 6s ease-in-out infinite;
        }
        .right-eyebrow {
            transform-box: fill-box;
            transform-origin: center bottom;
            animation: rightBrowRaise 7s ease-in-out infinite 2s;
        }
        @keyframes leftBrowRaise {
            0%, 80%, 100% { transform: translateY(0) rotate(0deg); }
            85% { transform: translateY(-1.5px) rotate(-2deg); }
            90% { transform: translateY(-0.5px) rotate(0.5deg); }
            95% { transform: translateY(0) rotate(0deg); }
        }
        @keyframes rightBrowRaise {
            0%, 75%, 100% { transform: translateY(0) rotate(0deg); }
            80% { transform: translateY(-1.2px) rotate(2deg); }
            86% { transform: translateY(-0.4px) rotate(-0.5deg); }
            92% { transform: translateY(0) rotate(0deg); }
        }

        /* Nose subtle twitch */
        .nose {
            transform-box: fill-box;
            transform-origin: center top;
            animation: noseTwitch 8s ease-in-out infinite 2s;
        }
        @keyframes noseTwitch {
            0%, 70%, 82%, 100% { transform: translateX(0) scaleX(1); }
            73% { transform: translateX(0.4px) scaleX(1.02); }
            76% { transform: translateX(-0.3px) scaleX(0.98); }
            79% { transform: translateX(0.2px) scaleX(1.01); }
        }

        /* Subtle body sway */
        .body-sway {
            animation: sway 11s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center bottom;
        }
        @keyframes sway {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(0.3deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-0.3deg); }
        }
    </style>
</head>
